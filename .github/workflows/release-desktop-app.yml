name: Release Electron App
# Runs only when started by hand: Actions > Release Electron App > Run workflow.
# It builds the branch you pick there and makes a draft release named for its tag,
# which is v<version from package.json> unless you type a different one.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty for v + the version in package.json)"
        required: false
        default: ""
permissions:
  id-token: write # Required for OIDC
  contents: write # Required for creating releases
jobs:
  publish:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      # checkout v7, setup-node v7 and release-action v1.21.0 all run on Node 24
      # (GitHub removed the Node 20 runtime for actions in September 2026).
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 LTS. Electron Forge 8 needs Node 22.13 or newer.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Work out the release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }} # (through env, not pasted into the script)
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then tag="v$(node -p "require('./package.json').version")"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build and upload binaries
        run: npm run electron:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JSPAINT_OFFICIAL_RELEASE: "true"

      - name: Extract changelog section
        if: runner.os == 'Windows'
        id: changelog
        shell: bash
        run: node scripts/release/extract-changelog.js >> $GITHUB_OUTPUT

      - name: Update Release
        if: runner.os == 'Windows'
        uses: ncipollo/release-action@v1.21.0
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          allowUpdates: true
          tag: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          commit: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true

      # - name: Publish to Windows Store
