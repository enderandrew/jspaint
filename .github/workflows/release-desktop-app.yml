name: Release Electron App
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  id-token: write # Required for OIDC
  contents: write # Required for creating releases
jobs:
  publish:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      # checkout v7, setup-node v7 and release-action v1.21.0 all run on Node 24
      # (GitHub removed the Node 20 runtime for actions in September 2026).
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 LTS. Electron Forge 8 needs Node 22.13 or newer.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci
        env:
          # The Cypress tests don't run here, so skip downloading its binary.
          CYPRESS_INSTALL_BINARY: "0"

      - name: Build and upload binaries
        run: npm run electron:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JSPAINT_OFFICIAL_RELEASE: "true"

      - name: Extract changelog section
        if: runner.os == 'Windows'
        id: changelog
        shell: bash
        run: node scripts/release/extract-changelog.js >> $GITHUB_OUTPUT

      - name: Update Release
        if: runner.os == 'Windows'
        uses: ncipollo/release-action@v1.21.0
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          allowUpdates: true
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true

      # - name: Publish to Windows Store
      #   uses: isaacrlevin/windows-store-action@25ac1ac31e3434add3fede11f458a453fe371fb0
